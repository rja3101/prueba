{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SISACAD{% endblock %}</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8fafc;
    }
    .navbar {
      background: linear-gradient(90deg, #0ea5e9, #1d4ed8);
    }
    .navbar-brand, .nav-link {
      color: white !important;
      font-weight: 500;
    }
    .navbar-brand:hover, .nav-link:hover {
      opacity: 0.85;
    }
    footer {
      background-color: #0f172a;
      color: #cbd5e1;
      text-align: center;
      padding: 10px;
      margin-top: 3rem;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'academics:student_dashboard' %}">SISACAD</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="{% url 'academics:student_dashboard' %}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'academics:student_courses' %}">Mis cursos</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'academics:student_grades' %}">Mis notas</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'academics:student_offerings' %}">Matricularme</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'academics:student_schedule' %}">Horario</a></li>
        </ul>
        <span class="navbar-text text-light me-3">
          {{ request.user.first_name }}
        </span>
        <a href="{% url 'users:logout' %}" class="btn btn-outline-light btn-sm">Salir</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    {% block content %}
    {% endblock %}
  </main>

  <footer>
    <small>© 2025 Universidad Nacional de San Agustín - SISACAD</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
