{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingreso al Sistema Académico</title>
  <!-- Bootstrap vía CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card-login {
      max-width: 420px;
      width: 100%;
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.6);
      overflow: hidden;
    }
    .card-header-custom {
      background: radial-gradient(circle at top left, #38bdf8, #0ea5e9, #1d4ed8);
      color: #f9fafb;
      padding: 1.75rem 2rem;
    }
    .card-header-custom h1 {
      font-size: 1.5rem;
      margin: 0;
      font-weight: 700;
    }
    .card-header-custom p {
      margin: 0.25rem 0 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .btn-primary {
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .form-control {
      border-radius: 999px;
    }
    .form-control:focus {
      box-shadow: 0 0 0 0.2rem rgba(56, 189, 248, 0.3);
      border-color: #38bdf8;
    }
    .text-small {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card card-login bg-dark text-light">
    <div class="card-header-custom">
      <h1>SISACAD</h1>
      <p>Inicia sesión con tu usuario y contraseña</p>
    </div>
    <div class="card-body p-4">
      {% if form.errors %}
        <div class="alert alert-danger text-small">
          Usuario o contraseña incorrectos. Inténtalo nuevamente.
        </div>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}

        <div class="mb-3">
          <label for="id_username" class="form-label text-small">Usuario</label>
          <input
            type="text"
            name="username"
            class="form-control"
            id="id_username"
            placeholder="correo institucional o usuario"
            required
            autofocus
          >
        </div>

        <div class="mb-3">
          <label for="id_password" class="form-label text-small">Contraseña</label>
          <input
            type="password"
            name="password"
            class="form-control"
            id="id_password"
            placeholder="Contraseña"
            required
          >
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="text-small text-muted">
            ¿Olvidaste tu contraseña? contacta a Secretaría.
          </span>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">
            Ingresar
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
